services:
  base-datos:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eventos}
      POSTGRES_USER: ${POSTGRES_USER:-eventos_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventos_clave}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backup-postgres:
    image: postgres:17-alpine
    profiles: ["maintenance"]
    environment:
      PGHOST: base-datos
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-eventos}
      PGUSER: ${POSTGRES_USER:-eventos_app}
      PGPASSWORD: ${POSTGRES_PASSWORD:-eventos_clave}
    volumes:
      - ./backups:/backups
      - ./infra/backup:/backup-scripts:ro
    entrypoint: ["/bin/sh", "/backup-scripts/backup.sh"]

  restore-postgres:
    image: postgres:17-alpine
    profiles: ["maintenance"]
    environment:
      PGHOST: base-datos
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-eventos}
      PGUSER: ${POSTGRES_USER:-eventos_app}
      PGPASSWORD: ${POSTGRES_PASSWORD:-eventos_clave}
      BACKUP_FILE: ${BACKUP_FILE:-}
      RESTORE_TARGET_DATABASE: ${RESTORE_TARGET_DATABASE:-}
    volumes:
      - ./backups:/backups:ro
      - ./infra/backup:/backup-scripts:ro
    entrypoint: ["/bin/sh", "/backup-scripts/restore-validation.sh"]

  backend:
    build:
      context: ./backend
    environment:
      POSTGRES_HOST: base-datos
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-eventos}
      POSTGRES_USER: ${POSTGRES_USER:-eventos_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventos_clave}
      JWT_SECRET: ${JWT_SECRET:-desarrollo_secreto_local_de_al_menos_32_caracteres_12345}
      JWT_ACCESO_EXPIRACION_MINUTOS: ${JWT_ACCESO_EXPIRACION_MINUTOS:-15}
      JWT_REFRESH_EXPIRACION_DIAS: ${JWT_REFRESH_EXPIRACION_DIAS:-7}
      ADMIN_CORREO: ${ADMIN_CORREO:-AdminEventos@gmail.com}
      ADMIN_CLAVE: ${ADMIN_CLAVE:-Admin123}
      DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-false}
      SERVICIO_IA_URL: ${SERVICIO_IA_URL:-http://servicio-ia:8000}
      CORS_ORIGENES: ${CORS_ORIGENES:-http://localhost:4200}
      URL_FRONTEND_WEB: ${URL_FRONTEND_WEB:-http://localhost:4200}
      URL_APLICACION_MOVIL: ${URL_APLICACION_MOVIL:-eventos://recuperar-clave}
      AUDIT_KMS_KEY_ID: ${AUDIT_KMS_KEY_ID:-alias/bitacora-payload-local}
      AUDIT_KMS_INDICE_KEY_ID: ${AUDIT_KMS_INDICE_KEY_ID:-alias/bitacora-hmac-local}
      AUDIT_DEVELOPER_KEY_BASE64: ${AUDIT_DEVELOPER_KEY_BASE64:-}
      AUDIT_KMS_REGION: ${AUDIT_KMS_REGION:-us-east-1}
      AUDIT_KMS_ENDPOINT: ${AUDIT_KMS_ENDPOINT:-http://kms-local:4566}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-local-only}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-local-only}
      SMTP_HOST: ${SMTP_HOST:-smtp-relay.brevo.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@eventos.local}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS_ENABLE: ${SMTP_STARTTLS_ENABLE:-false}
      SMTP_STARTTLS_REQUIRED: ${SMTP_STARTTLS_REQUIRED:-false}
      SMTP_SSL_ENABLE: ${SMTP_SSL_ENABLE:-false}
      SMTP_CONNECTION_TIMEOUT_MS: ${SMTP_CONNECTION_TIMEOUT_MS:-10000}
      SMTP_TIMEOUT_MS: ${SMTP_TIMEOUT_MS:-10000}
      SMTP_WRITE_TIMEOUT_MS: ${SMTP_WRITE_TIMEOUT_MS:-10000}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_FROM_EMAIL: ${BREVO_FROM_EMAIL:-}
      BREVO_FROM_NAME: ${BREVO_FROM_NAME:-Plataforma de eventos}
      NOTIFICACIONES_SCHEDULER_ENABLED: ${NOTIFICACIONES_SCHEDULER_ENABLED:-false}
      NOTIFICACIONES_INTERVALO_MS: ${NOTIFICACIONES_INTERVALO_MS:-60000}
      NOTIFICACIONES_INICIO_MS: ${NOTIFICACIONES_INICIO_MS:-20000}
      RECUPERACION_CLAVE_EXPIRACION_MINUTOS: ${RECUPERACION_CLAVE_EXPIRACION_MINUTOS:-30}
      RECUPERACION_CLAVE_INTERVALO_SOLICITUD_SEGUNDOS: ${RECUPERACION_CLAVE_INTERVALO_SOLICITUD_SEGUNDOS:-60}
      STRIPE_ENABLED: ${STRIPE_ENABLED:-true}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-${STRIPE_API_KEY:-}}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_PUBLIC_KEY: ${STRIPE_PUBLIC_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_MONEDA: ${STRIPE_MONEDA:-bob}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      base-datos:
        condition: service_healthy
      kms-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    restart: unless-stopped

  kms-local:
    image: localstack/localstack:4.4
    environment: { SERVICES: kms, AWS_DEFAULT_REGION: us-east-1, PERSISTENCE: 1 }
    volumes:
      - datos_localstack:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health | grep '\"kms\"' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  kms-bootstrap:
    image: amazon/aws-cli:2.27.29
    environment: { AWS_ACCESS_KEY_ID: local-only, AWS_SECRET_ACCESS_KEY: local-only, AWS_DEFAULT_REGION: us-east-1 }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        for a in alias/bitacora-payload-local alias/bitacora-hmac-local; do if ! aws --endpoint-url=http://kms-local:4566 kms describe-key --key-id $$a >/dev/null 2>&1; then case $$a in alias/bitacora-payload-local) o="--key-spec SYMMETRIC_DEFAULT --key-usage ENCRYPT_DECRYPT" ;; alias/bitacora-hmac-local) o="--key-spec HMAC_256 --key-usage GENERATE_VERIFY_MAC" ;; esac; k=$$(aws --endpoint-url=http://kms-local:4566 kms create-key $$o --query KeyMetadata.KeyId --output text) && aws --endpoint-url=http://kms-local:4566 kms create-alias --alias-name $$a --target-key-id $$k; fi; done
    depends_on:
      kms-local:
        condition: service_healthy

  frontend-web:
    build:
      context: ./frontend-web
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  servicio-ia:
    build:
      context: ./servicio-ia
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "${SERVICIO_IA_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; urlopen('http://localhost:8000/api/salud')\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  datos_postgres:
  datos_localstack:
