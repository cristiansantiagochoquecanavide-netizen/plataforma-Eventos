services:
  backend:
    environment:
      CORS_ORIGENES: ${CORS_ORIGENES:?Definir CORS_ORIGENES con la URL publica del frontend}
      URL_FRONTEND_WEB: ${URL_FRONTEND_WEB:?Definir URL_FRONTEND_WEB con la URL publica del frontend}
      SMTP_HOST: ${SMTP_HOST:?Definir SMTP_HOST del proveedor transaccional}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?Definir SMTP_USER del proveedor transaccional}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Definir SMTP_PASSWORD del proveedor transaccional}
      SMTP_FROM: ${SMTP_FROM:?Definir SMTP_FROM con un remitente verificado}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS_ENABLE: ${SMTP_STARTTLS_ENABLE:-true}
      SMTP_STARTTLS_REQUIRED: ${SMTP_STARTTLS_REQUIRED:-true}
      SMTP_SSL_ENABLE: ${SMTP_SSL_ENABLE:-false}
      SMTP_CONNECTION_TIMEOUT_MS: ${SMTP_CONNECTION_TIMEOUT_MS:-10000}
      SMTP_TIMEOUT_MS: ${SMTP_TIMEOUT_MS:-10000}
      SMTP_WRITE_TIMEOUT_MS: ${SMTP_WRITE_TIMEOUT_MS:-10000}

  mailpit:
    profiles:
      - local-mail
