AWSTemplateFormatVersion: '2010-09-09'
Description: Plataforma de Gestion de Eventos - entorno inicial en ECS Fargate

Parameters:
  BackendImage:
    Type: String
  FrontendImage:
    Type: String
  IaImage:
    Type: String
  ProxyAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  AdminEmail:
    Type: String
  ApplicationSecretsArn:
    Type: String
    Description: ARN de Secrets Manager con jwt-secret, admin-password, smtp-user y smtp-password
  SesFrom:
    Type: String
  DeveloperAuditKeySecretArn:
    Type: String
  DeveloperAuditSecretKmsKeyArn:
    Type: String
  PublicDomainName:
    Type: String
    Description: Subdominio DuckDNS usado por Caddy para HTTPS
  EnableLegacyAuditPayloadDecrypt:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

Conditions:
  LegacyAuditPayloadDecryptEnabled: !Equals [!Ref EnableLegacyAuditPayloadDecrypt, 'true']

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.40.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: plataforma-eventos-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref Vpc

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.40.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: plataforma-eventos-public-a

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.40.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: plataforma-eventos-public-b

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetA

  PublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetB

  ProxySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTPS ingress for the DuckDNS reverse proxy
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB accepts HTTP only from the reverse proxy Elastic IP
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Sub '${ProxyElasticIp}/32'
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Trafico de tareas ECS desde el balanceador
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL accesible solo desde tareas backend
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref TaskSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subredes PostgreSQL de plataforma-eventos
      SubnetIds:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      AllocatedStorage: 20
      BackupRetentionPeriod: 1
      DBInstanceClass: db.t3.micro
      DBName: eventos
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      DeletionProtection: true
      Engine: postgres
      MasterUsername: eventos_app
      ManageMasterUserPassword: true
      MultiAZ: false
      PubliclyAccessible: false
      PreferredBackupWindow: '03:00-04:00'
      StorageEncrypted: true
      VPCSecurityGroups:
        - !GetAtt DatabaseSecurityGroup.GroupId

  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-developer-owned-audit-secret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref DeveloperAuditKeySecretArn
                  - !Ref ApplicationSecretsArn
                  - !GetAtt Database.MasterUserSecret.SecretArn
        - PolicyName: decrypt-developer-owned-audit-secret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !Ref DeveloperAuditSecretKmsKeyArn

  AuditPayloadKmsKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Legacy KMS key retained only to decrypt version 1 audit envelopes during migration
      Enabled: true
      EnableKeyRotation: true
      KeySpec: SYMMETRIC_DEFAULT
      KeyUsage: ENCRYPT_DECRYPT
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableAccountRootKeyAdministration
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'

  AuditIndexKmsKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Legacy audit blind-index HMAC key retained through v1 index reindexing
      Enabled: true
      KeySpec: HMAC_256
      KeyUsage: GENERATE_VERIFY_MAC
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableAccountRootKeyAdministration
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'

  BackendTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: audit-kms-least-privilege
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AuditLegacyBlindIndexMac
                Effect: Allow
                Action:
                  - kms:GenerateMac
                Resource: !GetAtt AuditIndexKmsKey.Arn

  LegacyAuditPayloadDecryptPolicy:
    Type: AWS::IAM::Policy
    Condition: LegacyAuditPayloadDecryptEnabled
    Properties:
      PolicyName: temporary-legacy-audit-payload-decrypt
      Roles:
        - !Ref BackendTaskRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AuditPayloadEnvelopeDecryptDuringMigration
            Effect: Allow
            Action: kms:Decrypt
            Resource: !GetAtt AuditPayloadKmsKey.Arn

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      SecurityGroups:
        - !Ref LoadBalancerSecurityGroup
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      Type: application

  ProxyElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: plataforma-eventos-duckdns-proxy

  ProxyInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ProxyAmiId
      InstanceType: t3.micro
      NetworkInterfaces:
        - DeviceIndex: '0'
          SubnetId: !Ref PublicSubnetA
          AssociatePublicIpAddress: true
          GroupSet:
            - !Ref ProxySecurityGroup
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          dnf install -y docker bind-utils
          systemctl enable --now docker
          DOMAIN='${PublicDomainName}'
          ALB='${LoadBalancer.DNSName}'
          PUBLIC_IP='${ProxyElasticIp}'
          mkdir -p /opt/plataforma-eventos/caddy
          cat > /opt/plataforma-eventos/caddy/Caddyfile <<EOF
          ${PublicDomainName} {
            reverse_proxy http://${LoadBalancer.DNSName}
          }
          EOF
          until getent ahostsv4 "$DOMAIN" | awk '{print $1}' | grep -Fxq "$PUBLIC_IP"; do
            sleep 30
          done
          docker run -d --name caddy --restart unless-stopped \
            -p 80:80 -p 443:443 -p 443:443/udp \
            -v /opt/plataforma-eventos/caddy/Caddyfile:/etc/caddy/Caddyfile:ro \
            -v caddy-data:/data -v caddy-config:/config caddy:2-alpine

  ProxyElasticIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt ProxyElasticIp.AllocationId
      InstanceId: !Ref ProxyInstance

  FrontendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Port: 80
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref Vpc
      HealthCheckPath: /
      Matcher:
        HttpCode: 200-399

  BackendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref Vpc
      HealthCheckPath: /actuator/health
      Matcher:
        HttpCode: '200'

  IaTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Port: 8000
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref Vpc
      HealthCheckPath: /api/salud
      Matcher:
        HttpCode: '200'

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref FrontendTargetGroup
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP

  BackendListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      Actions:
        - Type: forward
          TargetGroupArn: !Ref BackendTargetGroup
      Conditions:
        - Field: path-pattern
          Values:
            - /api/*
      ListenerArn: !Ref HttpListener
      Priority: 10

  IaListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      Actions:
        - Type: forward
          TargetGroupArn: !Ref IaTargetGroup
      Conditions:
        - Field: path-pattern
          Values:
            - /api/salud
      ListenerArn: !Ref HttpListener
      Priority: 5

  WebSocketListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      Actions:
        - Type: forward
          TargetGroupArn: !Ref BackendTargetGroup
      Conditions:
        - Field: path-pattern
          Values:
            - /ws
            - /ws/*
            - /ws-puro
            - /ws-puro/*
      ListenerArn: !Ref HttpListener
      Priority: 8

  BackendTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Cpu: '512'
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt BackendTaskRole.Arn
      ContainerDefinitions:
        - Name: backend
          Image: !Ref BackendImage
          Essential: true
          PortMappings:
            - ContainerPort: 8080
          Environment:
            - Name: POSTGRES_HOST
              Value: !GetAtt Database.Endpoint.Address
            - Name: POSTGRES_PORT
              Value: '5432'
            - Name: POSTGRES_DB
              Value: eventos
            - Name: POSTGRES_USER
              Value: eventos_app
            - Name: ADMIN_CORREO
              Value: !Ref AdminEmail
            - Name: CORS_ORIGENES
              Value: !Sub https://${PublicDomainName}
            - Name: URL_FRONTEND_WEB
              Value: !Sub https://${PublicDomainName}
            - Name: URL_APLICACION_MOVIL
              Value: eventos://recuperar-clave
            - Name: SMTP_HOST
              Value: !Sub email-smtp.${AWS::Region}.amazonaws.com
            - Name: SMTP_PORT
              Value: '587'
            - Name: SMTP_AUTH
              Value: 'true'
            - Name: SMTP_STARTTLS_ENABLE
              Value: 'true'
            - Name: SMTP_STARTTLS_REQUIRED
              Value: 'true'
            - Name: SMTP_SSL_ENABLE
              Value: 'false'
            - Name: SMTP_FROM
              Value: !Ref SesFrom
            - Name: RECUPERACION_CLAVE_EXPIRACION_MINUTOS
              Value: '30'
            - Name: RECUPERACION_CLAVE_INTERVALO_SOLICITUD_SEGUNDOS
              Value: '60'
            - Name: AUDIT_KMS_KEY_ID
              Value: !Ref AuditPayloadKmsKey
            - Name: AUDIT_KMS_INDICE_KEY_ID
              Value: !Ref AuditIndexKmsKey
            - Name: AUDIT_KMS_REGION
              Value: !Ref AWS::Region
          Secrets:
            - Name: POSTGRES_PASSWORD
              ValueFrom: !Sub '${Database.MasterUserSecret.SecretArn}:password::'
            - Name: JWT_SECRET
              ValueFrom: !Sub '${ApplicationSecretsArn}:jwt-secret::'
            - Name: ADMIN_CLAVE
              ValueFrom: !Sub '${ApplicationSecretsArn}:admin-password::'
            - Name: SMTP_USER
              ValueFrom: !Sub '${ApplicationSecretsArn}:smtp-user::'
            - Name: SMTP_PASSWORD
              ValueFrom: !Sub '${ApplicationSecretsArn}:smtp-password::'
            - Name: AUDIT_DEVELOPER_KEY_BASE64
              ValueFrom: !Ref DeveloperAuditKeySecretArn
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: backend

  BackendService:
    Type: AWS::ECS::Service
    DependsOn:
      - BackendListenerRule
      - WebSocketListenerRule
    Properties:
      Cluster: !Ref EcsCluster
      DesiredCount: 1
      HealthCheckGracePeriodSeconds: 240
      LaunchType: FARGATE
      TaskDefinition: !Ref BackendTaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref TaskSecurityGroup
          Subnets:
            - !Ref PublicSubnetA
            - !Ref PublicSubnetB
      LoadBalancers:
        - ContainerName: backend
          ContainerPort: 8080
          TargetGroupArn: !Ref BackendTargetGroup

  FrontendTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: frontend
          Image: !Ref FrontendImage
          Essential: true
          PortMappings:
            - ContainerPort: 80
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: frontend

  FrontendService:
    Type: AWS::ECS::Service
    DependsOn:
      - HttpListener
    Properties:
      Cluster: !Ref EcsCluster
      DesiredCount: 1
      LaunchType: FARGATE
      TaskDefinition: !Ref FrontendTaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref TaskSecurityGroup
          Subnets:
            - !Ref PublicSubnetA
            - !Ref PublicSubnetB
      LoadBalancers:
        - ContainerName: frontend
          ContainerPort: 80
          TargetGroupArn: !Ref FrontendTargetGroup

  IaTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: servicio-ia
          Image: !Ref IaImage
          Essential: true
          PortMappings:
            - ContainerPort: 8000
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ia

  IaService:
    Type: AWS::ECS::Service
    DependsOn:
      - IaListenerRule
    Properties:
      Cluster: !Ref EcsCluster
      DesiredCount: 1
      LaunchType: FARGATE
      TaskDefinition: !Ref IaTaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref TaskSecurityGroup
          Subnets:
            - !Ref PublicSubnetA
            - !Ref PublicSubnetB
      LoadBalancers:
        - ContainerName: servicio-ia
          ContainerPort: 8000
          TargetGroupArn: !Ref IaTargetGroup

Outputs:
  ApplicationUrl:
    Value: !Sub https://${PublicDomainName}
  ProxyElasticIp:
    Description: Set this IPv4 address in the DuckDNS A record; leave IPv6 empty.
    Value: !Ref ProxyElasticIp
  ApiUrl:
    Value: !Sub https://${PublicDomainName}/api
  IaHealthUrl:
    Value: !Sub https://${PublicDomainName}/api/salud
  EcsClusterName:
    Value: !Ref EcsCluster
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  DatabaseCredentialsSecretArn:
    Value: !GetAtt Database.MasterUserSecret.SecretArn
  AuditPayloadKmsKeyArn:
    Value: !GetAtt AuditPayloadKmsKey.Arn
  AuditIndexKmsKeyArn:
    Value: !GetAtt AuditIndexKmsKey.Arn
