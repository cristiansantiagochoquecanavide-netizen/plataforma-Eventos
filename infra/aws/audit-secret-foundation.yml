AWSTemplateFormatVersion: '2010-09-09'
Description: Retained developer-controlled KMS key and audit encryption secret

Resources:
  DeveloperAuditSecretKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Encrypts the external developer-owned audit encryption secret
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableAccountRootKeyAdministration
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'
      Tags:
        - Key: Application
          Value: plataforma-eventos
        - Key: Purpose
          Value: developer-audit-secret

  DeveloperAuditSecretKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/plataforma-eventos-developer-audit-secret
      TargetKeyId: !Ref DeveloperAuditSecretKey

  DeveloperAuditEncryptionSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: plataforma-eventos/developer-audit-key
      Description: Base64-encoded 32-byte AES key for encrypted audit payloads
      KmsKeyId: !GetAtt DeveloperAuditSecretKey.Arn
      GenerateSecretString:
        PasswordLength: 43
        ExcludePunctuation: true
        IncludeSpace: false
      Tags:
        - Key: Application
          Value: plataforma-eventos
        - Key: Purpose
          Value: developer-audit-encryption-key

Outputs:
  DeveloperAuditSecretArn:
    Description: Pass this ARN as DeveloperAuditKeySecretArn to the platform stack
    Value: !Ref DeveloperAuditEncryptionSecret
  DeveloperAuditSecretKmsKeyArn:
    Description: Pass this ARN as DeveloperAuditSecretKmsKeyArn to the platform stack
    Value: !GetAtt DeveloperAuditSecretKey.Arn
  DeveloperAuditSecretKmsKeyAlias:
    Value: !Ref DeveloperAuditSecretKeyAlias
