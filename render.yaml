databases:
  - name: eventos-db
    databaseName: eventos
    user: eventos_app
    plan: free
    region: oregon
    ipAllowList: []

services:
  - type: web
    name: plataforma-eventos-web
    runtime: static
    rootDir: frontend-web
    buildCommand: npm ci && npm run build:render
    staticPublishPath: dist/frontend-web/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: BACKEND_API_URL
        fromService:
          type: web
          name: plataforma-eventos-api
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: plataforma-eventos-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "8080"
      - key: POSTGRES_HOST
        fromDatabase:
          name: eventos-db
          property: host
      - key: POSTGRES_PORT
        value: "5432"
      - key: POSTGRES_DB
        fromDatabase:
          name: eventos-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: eventos-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: eventos-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_CORREO
        sync: false
      - key: ADMIN_CLAVE
        generateValue: true
      - key: AUDIT_DEVELOPER_KEY_BASE64
        generateValue: true
      - key: CORS_ORIGENES
        fromService:
          type: web
          name: plataforma-eventos-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: URL_FRONTEND_WEB
        fromService:
          type: web
          name: plataforma-eventos-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: SERVICIO_IA_URL
        fromService:
          type: web
          name: plataforma-eventos-ia
          envVarKey: RENDER_EXTERNAL_URL
      - key: SERVICIO_IA_API_KEY
        fromService:
          type: web
          name: plataforma-eventos-ia
          envVarKey: SERVICIO_IA_API_KEY
      - key: DEMO_SEED_ENABLED
        value: "false"
      - key: STRIPE_ENABLED
        value: "false"

  - type: web
    name: plataforma-eventos-ia
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./servicio-ia/Dockerfile
    dockerContext: ./servicio-ia
    healthCheckPath: /api/salud
    envVars:
      - key: PORT
        value: "8000"
      - key: SERVICIO_IA_API_KEY
        generateValue: true
